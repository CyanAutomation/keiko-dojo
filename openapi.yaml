openapi: 3.1.0
info:
  title: Keiko Dojo API
  version: 1.0.0
  description: >-
    User-scoped Judo session API. Bearer tokens must be EdDSA JWTs issued by
    Better Auth for audience keiko-dojo-api, with a maximum five-minute
    lifetime, matching sub and appUserId claims, and the scope required by the
    operation. Client-supplied account IDs and GitHub repository names never
    determine the data scope.
servers:
  - url: https://keiko-dojo.example.com
    description: Replace with the deployed Keiko API origin.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: Worker is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
        default:
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      security: []
      summary: Readiness probe
      responses:
        '200':
          description: D1 is reachable and auth configuration is present.
        '503':
          description: Required configuration or D1 is unavailable.
        default:
          $ref: '#/components/responses/InternalError'
  /v1/sessions:
    get:
      summary: List the caller's sessions
      description: Requires the sessions:read scope.
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Inclusive lower date bound.
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: Inclusive upper date bound.
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/SessionCategory'
        - in: query
          name: effort
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque keyset cursor returned by the previous page.
      responses:
        '200':
          description: Stable date-descending, ID-descending page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a session
      description: Requires the sessions:write scope. Missing IDs are generated by Keiko.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Created record, revision 1.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          description: The session ID already exists for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /v1/sessions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9_-]+$'
    get:
      summary: Retrieve a session
      description: Requires the sessions:read scope.
      responses:
        '200':
          description: Session and server-owned revision metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
    put:
      summary: Replace a session
      description: >-
        Requires sessions:write and an If-Match header from the latest GET.
        The path ID selects the record; if a body ID is present it must match.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Updated record with an incremented revision.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a session
      description: Requires sessions:write and an If-Match header from the latest GET.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Session deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: Strong ETag from the latest GET, formatted as a quoted revision number.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  headers:
    ETag:
      description: Strong entity tag containing the current revision number.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  schemas:
    SessionCategory:
      type: string
      enum: [Technical, Randori, Shiai, Cardio, S&C]
    SessionFields:
      type: object
      required: [date, techniques, effort, category]
      description: Unknown fields are ignored by the service.
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        techniques:
          type: array
          items:
            type: string
            minLength: 1
        effort:
          type: integer
          minimum: 1
          maximum: 5
        category:
          $ref: '#/components/schemas/SessionCategory'
        notes:
          type: string
        duration:
          type: integer
          minimum: 0
          description: Session duration in minutes.
        videoUrl:
          type: string
          format: uri
          description: Absolute HTTP(S) URL; private or internal network hosts are rejected.
    Session:
      allOf:
        - $ref: '#/components/schemas/SessionFields'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 100
              pattern: '^[A-Za-z0-9_-]+$'
    CreateSessionRequest:
      allOf:
        - $ref: '#/components/schemas/SessionFields'
        - type: object
          properties:
            id:
              type: [string, 'null']
              maxLength: 100
              pattern: '^[A-Za-z0-9_-]+$'
      description: Session fields; id may be omitted and generated by Keiko.
    UpdateSessionRequest:
      allOf:
        - $ref: '#/components/schemas/SessionFields'
        - type: object
          properties:
            id:
              type: string
              maxLength: 100
              pattern: '^[A-Za-z0-9_-]+$'
      description: Session fields. If id is supplied, it must match the path ID.
    SessionRecord:
      type: object
      required: [session, revision]
      description: Use revision as If-Match by quoting the number, for example "3".
      properties:
        session:
          $ref: '#/components/schemas/Session'
        revision:
          type: integer
          minimum: 1
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionRecord'
    SessionListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionRecord'
        pagination:
          type: object
          required: [nextCursor, hasMore]
          properties:
            nextCursor:
              type: [string, 'null']
            hasMore:
              type: boolean
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
  responses:
    BadRequest:
      description: Invalid request, filters, session payload, or If-Match header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired, or invalid access token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InsufficientScope:
      description: Token does not grant the required session scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthUnavailable:
      description: Identity provider or configuration is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Session does not exist in the authenticated user's account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RevisionConflict:
      description: ETag does not match the current session revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: If-Match is required for session mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body is larger than 64 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Request body must use application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected internal error. The response includes a request ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
