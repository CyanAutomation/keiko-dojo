openapi: 3.1.0
info:
  title: Keiko Dojo API
  version: 1.2.0
  description: >-
    User-scoped Judo session API. Bearer tokens must be EdDSA JWTs issued by
    Better Auth for audience keiko-dojo-api, with a maximum five-minute
    lifetime, matching sub and appUserId claims, and the scope required by the
    operation. Every response includes X-Request-Id; error envelopes repeat the
    identifier in requestId. Client-supplied account IDs and GitHub repository
    names never determine the data scope. POST /v1/sessions optionally accepts
    Idempotency-Key, scoped to the verified user. A successful key and its
    original result are retained indefinitely; retries with an equivalent
    validated session payload replay the original 201 response and ETag.
servers:
  - url: https://keiko-dojo.example.com
    description: Replace with the deployed Keiko API origin.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: Worker is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
        default:
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      security: []
      summary: Readiness probe
      responses:
        '200':
          description: D1 is reachable and auth configuration is present.
        '503':
          description: Required configuration or D1 is unavailable.
        default:
          $ref: '#/components/responses/InternalError'
  /v1/sessions:
    get:
      summary: List the caller's sessions
      description: Requires the sessions:read scope.
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Inclusive lower date bound.
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: Inclusive upper date bound.
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/SessionCategory'
        - in: query
          name: effort
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque keyset cursor returned by the previous page; clients must not inspect or construct it. Maximum encoded length is 512 characters.
      responses:
        '200':
          description: Stable date-descending, ID-descending page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a session
      description: >-
        Requires the sessions:write scope. Missing IDs are generated by Keiko.
        Idempotency-Key is optional and identifies one logical create for the
        verified user. The first valid request returns 201. Reusing its key
        with the same canonical validated payload returns the original
        revision-1 record and user-scoped ETag; the request ID is new. Reusing
        the key with a different payload returns 409 idempotency_key_reuse.
        D1 commits the session and key record atomically, so concurrent
        identical requests create one session. Keys are retained indefinitely;
        they are not credentials and are scoped to the authenticated user.
        Calls without a key retain the legacy creation behavior.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Created record, revision 1.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          description: >-
            session_conflict means the session ID already exists for this user.
            idempotency_key_reuse means this user's key is already committed
            for a different validated request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /v1/sessions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9_-]+$'
    get:
      summary: Retrieve a session
      description: Requires sessions:read. Supports private ETag revalidation.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Session and server-owned revision metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '304':
          description: The user-scoped entity tag still matches the current record.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
    put:
      summary: Replace a session
      description: >-
        Requires sessions:write and an If-Match header from the latest GET.
        The path ID selects the record; if a body ID is present it must match.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Updated record with an incremented revision.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a session
      description: Requires sessions:write and an If-Match header from the latest GET.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Session deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /v1/analytics/summary:
    get:
      summary: Read the caller's training summary
      description: Requires sessions:read. Aggregates and backup status are scoped to the verified subject.
      responses:
        '200':
          description: Session totals, distributions, recent effort, and backup status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /v1/backups/status:
    get:
      summary: Read the caller's GitHub Markdown sync status
      description: Requires backups:read. Returns only the caller's selected repository and pending sync state.
      responses:
        '200':
          description: Current connection and delayed sync state.
          content:
            application/json:
              schema:
                type: object
                required: [configured, installation, pending, nextSyncAt, lastSyncedAt, error]
                properties:
                  configured: { type: boolean }
                  installation:
                    oneOf:
                      - type: object
                        required: [owner, repository]
                        properties:
                          owner: { type: string }
                          repository: { type: string }
                      - type: 'null'
                  pending: { type: boolean }
                  nextSyncAt: { type: [string, 'null'], format: date-time }
                  lastSyncedAt: { type: [string, 'null'], format: date-time }
                  error: { type: [string, 'null'] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /v1/backups/github-installation:
    get:
      summary: Read the GitHub backup connection
      description: Requires backups:read and returns only the caller's selected repository.
      responses:
        '200':
          description: Connection status without installation tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubInstallationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      summary: Start GitHub App installation
      description: Requires backups:write. Returns a one-time, user-bound installation URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: One-time installation URL and expiration.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Disconnect GitHub backup access
      description: Requires backups:write. Keiko stops minting installation tokens immediately.
      responses:
        '204':
          description: Connection revoked within Keiko.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /v1/backups/github-installation/callback:
    get:
      security: []
      summary: Complete GitHub App installation
      description: GitHub redirect callback. Requires a valid one-time state created by the authenticated start endpoint.
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: installation_id
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '302':
          description: Redirect to the configured MatMetrics origin with a generic result.
          headers:
            Location:
              description: Absolute redirect URL containing only the generic callback result.
              schema:
                type: string
                format: uri
  /v1/github/health:
    post:
      summary: Queue a GitHub App connection check
      description: Requires github:read. The connected repository is taken from the caller's selected GitHub App installation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch: { type: string, maxLength: 255 }
              additionalProperties: false
      responses:
        '202':
          description: GitHub health job queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubOperationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '409':
          description: No GitHub App repository is connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/InternalError' }
  /v1/github/sync-all:
    post:
      summary: Queue a full D1-to-GitHub Markdown sync
      description: Requires github:write. Reconciles the caller's current D1 sessions with its selected Markdown repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: Full Markdown reconciliation queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubOperationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '409':
          description: No GitHub App repository is connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/InternalError' }
  /v1/github/log-doctor:
    post:
      summary: Queue a selected-repository Markdown scan
      description: Requires github:read. The scan is restricted to session Markdown files in the connected repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch: { type: string, maxLength: 255 }
              additionalProperties: false
      responses:
        '202':
          description: Log Doctor scan queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubOperationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '409':
          description: No GitHub App repository is connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/InternalError' }
  /v1/github/log-doctor/fix:
    post:
      summary: Queue a Log Doctor preview or confirmed fix
      description: Requires github:write. Fix paths must identify session Markdown files in data/YYYY/MM/; apply mode requires confirmApply=true and is limited to 25 files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, paths]
              properties:
                branch: { type: string, maxLength: 255 }
                mode: { type: string, enum: [dry-run, apply] }
                confirmApply: { type: boolean }
                options:
                  type: object
                  properties:
                    normalizeFrontmatter: { type: boolean, enum: [true] }
                    enforceSectionOrder: { type: boolean, enum: [true] }
                    preserveUserContent: { type: boolean, enum: [true] }
                  additionalProperties: false
                paths:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items: { type: string, pattern: '^data/\d{4}/\d{2}/\d{8}-matmetrics-[A-Za-z0-9_-]{1,100}\.md$' }
              additionalProperties: false
      responses:
        '202':
          description: Log Doctor fix job queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubOperationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '409':
          description: No GitHub App repository is connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/InternalError' }
  /v1/github/jobs/{jobId}:
    get:
      summary: Read a GitHub operation job
      description: Requires github:read. Job lookup is scoped to the verified caller.
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,100}$' }
      responses:
        '200':
          description: Current job status and, when completed, its operation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubOperationJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
        default: { $ref: '#/components/responses/InternalError' }
  /mcp:
    post:
      summary: Stateless MCP endpoint
      description: >-
        Accepts MCP JSON-RPC requests for initialize, tools/list, and tools/call.
        Every operation requires a Bearer token with sessions:read. Exposes
        list_sessions, get_session, and get_training_summary only.
      responses:
        '200':
          description: MCP JSON-RPC response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: >-
        Optional idempotency key for one logical session create. Accepts 1 to
        128 ASCII characters matching ^[A-Za-z0-9._~-]{1,128}$. UUID v4 is
        recommended for generated client keys. Keys are scoped to the verified
        user, are not authentication credentials, and their successful result
        is retained indefinitely. Reuse the key only for retries of the same
        validated payload.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]{1,128}$'
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      description: User-scoped ETag from a previous item response.
      schema:
        type: string
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: Strong user-scoped ETag from the latest GET. Legacy quoted revision numbers are also accepted.
      schema:
        type: string
        pattern: '^"(?:[1-9][0-9]*|[1-9][0-9]*-[a-f0-9]{24})"$'
  headers:
    ETag:
      description: Strong user-scoped entity tag containing the current revision.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*-[a-f0-9]{24}"$'
  schemas:
    SessionCategory:
      type: string
      enum: [Technical, Randori, Shiai, Cardio, S&C]
    SessionFields:
      type: object
      required: [date, techniques, effort, category]
      description: Unknown fields are ignored by the service.
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        techniques:
          type: array
          items:
            type: string
            minLength: 1
        effort:
          type: integer
          minimum: 1
          maximum: 5
        category:
          $ref: '#/components/schemas/SessionCategory'
        notes:
          type: string
        duration:
          type: integer
          minimum: 0
          description: Session duration in minutes.
        videoUrl:
          type: string
          format: uri
          description: Absolute HTTP(S) URL without embedded credentials; private or internal network hosts are rejected.
    Session:
      allOf:
        - $ref: '#/components/schemas/SessionFields'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 100
              pattern: '^[A-Za-z0-9_-]+$'
    CreateSessionRequest:
      allOf:
        - $ref: '#/components/schemas/SessionFields'
        - type: object
          properties:
            id:
              type: [string, 'null']
              maxLength: 100
              pattern: '^[A-Za-z0-9_-]+$'
      description: Session fields; id may be omitted and generated by Keiko.
    UpdateSessionRequest:
      allOf:
        - $ref: '#/components/schemas/SessionFields'
        - type: object
          properties:
            id:
              type: string
              maxLength: 100
              pattern: '^[A-Za-z0-9_-]+$'
      description: Session fields. If id is supplied, it must match the path ID.
    SessionRecord:
      type: object
      required: [session, revision]
      description: Use the ETag response header as If-Match. Legacy clients may quote the revision number.
      properties:
        session:
          $ref: '#/components/schemas/Session'
        revision:
          type: integer
          minimum: 1
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionRecord'
    SessionListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionRecord'
        pagination:
          type: object
          required: [nextCursor, hasMore]
          properties:
            nextCursor:
              type: [string, 'null']
              description: Opaque cursor for the next request, or null when the page is final. Non-null values are at most 512 characters.
            hasMore:
              type: boolean
              description: True exactly when nextCursor contains another page cursor.
    GitHubInstallationResponse:
      type: object
      required: [connected, installation]
      properties:
        connected:
          type: boolean
        installation:
          oneOf:
            - type: object
              required: [owner, repository, repositoryId, grantedAt]
              properties:
                owner: { type: string }
                repository: { type: string }
                repositoryId: { type: integer, minimum: 1 }
                grantedAt: { type: string, format: date-time }
            - type: 'null'
    GitHubOperationJob:
      type: object
      required: [id, type, status, attempts, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,100}$' }
        type: { enum: [github-health, log-doctor-scan, log-doctor-fix, github-sync-all] }
        status: { enum: [queued, running, completed, failed] }
        attempts: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        result: { type: object, additionalProperties: true }
        error: { type: string }
    AnalyticsSummary:
      type: object
      required: [totalSessions, averageEffort, distributions, recentEffort, backupStatus]
      properties:
        totalSessions:
          type: integer
        averageEffort:
          type: number
        distributions:
          type: object
          additionalProperties:
            type: object
            properties:
              categories:
                type: array
                items:
                  type: object
                  required: [name, count]
                  properties:
                    name: { type: string }
                    count: { type: integer }
              effort:
                type: array
                items:
                  type: object
                  required: [name, count]
                  properties:
                    name: { type: integer, minimum: 1, maximum: 5 }
                    count: { type: integer }
        recentEffort:
          type: array
          items:
            type: object
            required: [date, effort]
            properties:
              date: { type: string, format: date }
              effort: { type: integer, minimum: 1, maximum: 5 }
        backupStatus:
          type: object
          required: [configured, pending, lastSyncedAt]
          properties:
            configured: { type: boolean }
            pending: { type: boolean }
            lastSyncedAt: { type: [string, 'null'], format: date-time }
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
  responses:
    BadRequest:
      description: Invalid request, filters, session payload, If-Match header, or Idempotency-Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired, or invalid access token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InsufficientScope:
      description: Token does not grant the required session scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthUnavailable:
      description: Identity provider or configuration is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Per-user operation limit exceeded. Retry after the indicated delay.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource does not exist in the authenticated user's account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required service or operation queue is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RevisionConflict:
      description: ETag does not match the current session revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: If-Match is required for session mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body is larger than 64 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Request body must use application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected error, unsupported route, or method failure. The response includes a request ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
