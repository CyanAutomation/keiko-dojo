name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

jobs:
  worker:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Check OpenAPI compatibility with main
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:openapi.yaml > /tmp/keiko-main-openapi.yaml
          npm exec -- redocly diff /tmp/keiko-main-openapi.yaml openapi.yaml --fail-on major --check-version
      - run: npm run contract:check
      - run: npm run security:dependencies
      - run: npm test
      - run: npm run cf-typegen:check
      - run: npm run typecheck
      - run: npm run check:migrations

  secret-scan:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # Make PR coverage explicit; TruffleHog handles push and full-history events itself.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          version: 3.99.8
          extra_args: --no-verification
